# 文件：deploy/nginx.conf
# 描述：生产站点反代配置：80 全站跳 443，TLS 终结后反代到 laity-app-prod:3000，带 HSTS 与安全响应头
# 作者：张磊
# 创建日期：2026-10-30
# 修改记录：
# - 2026-10-30: 初始创建（Phase 6 环境准备）
# - 2026-11-04: I046 落地（我批准按经验改）：给后台登录端点加 limit_req；
#               反代公共参数从 location / 提到 server 层，让新加的那条 location 继承同一份，不复制第二份头部
# - 2026-11-04: I050 落地（我批准按经验改）：X-Forwarded-For 由 append 改为 $remote_addr 覆写——
#               应用层登录节流按该头的首跳计数，append 写法下客户端能自行塞进第一跳、来源可伪造
# - 2026-11-09: V2.0 Step 4-B 配套：口令登录退役后限速端点由 /api/auth/callback/admin 改指
#               /api/auth/callback/github（原端点已不存在，不改这条 limit_req 就是死配置）；
#               rate/burst 参数未动；两处注释里 admin-password.ts 的引用随模块退役改写
#
# 挂载位置：容器内 /etc/nginx/conf.d/default.conf（见 docker-compose.prod.yml 的 web 服务）
# 上线前必须替换三处：server_name 的域名、证书路径、（如需要）client_max_body_size

# conf.d 里的指令落在 http 上下文，zone 只能在这里声明（放进 server 块会 nginx: [emerg] ...）
# 登录走 GitHub OAuth，回调端点是唯一的登录入口：限速压的是脚本高频触发回调（交换 token、建会话），
# 5r/m 是"真人登录够用、脚本刷回调被压死"的折中，参数沿用口令时代未动
limit_req_zone $binary_remote_addr zone=laity_auth:10m rate=5r/m;

server {
    listen 80;
    listen [::]:80;
    server_name laity.cn;

    # 证书校验与 ACME 续期走得到，其余全部跳 HTTPS
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name laity.cn;

    ssl_certificate     /etc/nginx/certs/laity.crt;
    ssl_certificate_key /etc/nginx/certs/laity.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1h;

    # HSTS：确认证书自动续期稳定后再启用 preload
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    server_tokens off;
    # 与 SPEC 的 IMG_001 上限（5MB）留 1MB 余量；Phase 5b 上线前保持这一致
    client_max_body_size 6m;
    client_body_timeout  30s;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # 反代公共参数放在 server 层：下面每条 location 都继承同一份，改一处不会漏另一处
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    # Server Action 的同源比对读 x-forwarded-host 优先，缺了它某些链路下动作会被静默拒（I033）
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header X-Real-IP         $remote_addr;
    # 边缘覆写而不是 append（$proxy_add_x_forwarded_for）：本站只有这一层代理，没有上游链，
    # 追加写法会让客户端自带的 XFF 混进第一跳，把"来源地址"变成可伪造——
    # 访问日志与任何按来源计数的逻辑拿到的都必须是真实对端地址
    proxy_set_header X-Forwarded-For   $remote_addr;
    # NextAuth 靠 X-Forwarded-Proto 判定回调是否 https，缺了会掉回 http 造成 Cookie 不写
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 10s;
    proxy_send_timeout    60s;
    proxy_read_timeout    60s;
    proxy_buffering off;

    # OAuth 回调端点限速。精确匹配优先于 location /，命中上限时 nginx 直接回 429，
    # 请求根本不进应用；参数沿用口令时代的 5r/m + burst=5
    location = /api/auth/callback/github {
        limit_req zone=laity_auth burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://app:3000;
    }

    location / {
        proxy_pass http://app:3000;
    }
}

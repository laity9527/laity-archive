# 文件：deploy/nginx.conf
# 描述：生产站点反代配置：80 全站跳 443，TLS 终结后反代到 laity-app-prod:3000，带 HSTS 与安全响应头
# 作者：张磊
# 创建日期：2026-10-30
# 修改记录：
# - 2026-10-30: 初始创建（Phase 6 环境准备）
#
# 挂载位置：容器内 /etc/nginx/conf.d/default.conf（见 docker-compose.prod.yml 的 web 服务）
# 上线前必须替换三处：server_name 的域名、证书路径、（如需要）client_max_body_size

server {
    listen 80;
    listen [::]:80;
    server_name laity.example.com;

    # 证书校验与 ACME 续期走得到，其余全部跳 HTTPS
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name laity.example.com;

    ssl_certificate     /etc/nginx/certs/laity.crt;
    ssl_certificate_key /etc/nginx/certs/laity.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1h;

    # HSTS：确认证书自动续期稳定后再启用 preload
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    server_tokens off;
    # 与 SPEC 的 IMG_001 上限（5MB）留 1MB 余量；Phase 5b 上线前保持这一致
    client_max_body_size 6m;
    client_body_timeout  30s;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location / {
        proxy_pass http://app:3000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # NextAuth 靠 X-Forwarded-Proto 判定回调是否 https，缺了会掉回 http 造成 Cookie 不写
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
        proxy_buffering off;
    }
}

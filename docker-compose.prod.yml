# 文件：docker-compose.prod.yml
# 描述：生产编排：app（standalone 镜像）+ db（postgres:16，非 root 口令、不对宿主机开放端口）+ nginx（TLS 终结）；迁移走一次性 migrate 服务
# 作者：张磊
# 创建日期：2026-10-30
# 修改记录：
# - 2026-10-30: 初始创建（Phase 6 环境准备，对应 D6）
# - 2026-11-02: app 服务补 OSS_REGION/OSS_BUCKET/OSS_ACCESS_KEY_ID/OSS_ACCESS_KEY_SECRET 四行（I024，Phase 5b 生产上传打通）
# - 2026-11-02: preflight 同步补这四条判定，通过行改为附带地域与桶名（脱敏，不打密钥）。实测注意：变量缺失时 compose 的插值检查先失败，preflight 根本不会起跑，这层的作用是门禁清单自证 + 日后放宽 ${VAR:?} 时的兜底
# - 2026-11-03: I036 落地：app 探针从 /login 换成 /api/health 并校验响应体 db=true，start_period 20s→30s；
#               web 改为等 app healthy 再起（nginx 自身不加探针，理由见 web 处注释）
# - 2026-11-03: 修一个上线级漏项：app 从未接收 SITE_ICP 等合规位变量（--env-file 只插值不注入），
#               补 SITE_ICP / SITE_POLICE_ICP / SITE_CONTACT_EMAIL 三行，用 :- 允许留空
# - 2026-11-04: I026 结案：给 migrate 服务钉 image: laity-archive-migrate:prod。原先不写 image，
#               compose 构建到项目默认名 laity-archive-migrate:latest，而部署步骤核对的是 :prod 标签，
#               于是"连跑两次 ID 不变"量的根本是 compose 不碰的那个标签。实测钉死后 :prod 由
#               4b925be03f65 刷新为 d161c2e131b8，且新镜像内 /usr/bin/openssl 存在
#
# 用前必读：
#   1. cp .env.production.example .env.production，填真实值，两个口令不要与开发环境复用；
#   2. 证书放到 deploy/certs/laity.crt 与 laity.key（文件名要和 nginx.conf 里一致）；
#   3. 首次部署（--env-file 必须带，compose 默认只读 .env，不会自动读 .env.production）：
#      docker compose --env-file .env.production -f docker-compose.prod.yml build
#      docker compose --env-file .env.production -f docker-compose.prod.yml run --rm migrate
#      docker compose --env-file .env.production -f docker-compose.prod.yml up -d

services:
  # 上线门禁：DESIGN 风险清单写死"口令不改不发版"。compose 的 ${VAR:?} 只能拦空值，
  # 拦不住 root/root，所以用一次性容器先把口令与 scheme 判一遍，不合格就非零退出，整个 up 随之失败
  preflight:
    image: postgres:16
    container_name: laity-preflight
    entrypoint:
      - /bin/sh
      - -e
      - -c
      - |
        fail() { echo "上线门禁未通过：$1" >&2; exit 1; }
        [ "$${POSTGRES_USER:-}" = "root" ] && fail "数据库用户仍是 root"
        [ "$${POSTGRES_PASSWORD:-}" = "root" ] && fail "数据库口令仍是 root"
        [ "$${POSTGRES_PASSWORD:-}" = "$${POSTGRES_USER:-}" ] && fail "数据库口令与用户名相同"
        [ "$${#POSTGRES_PASSWORD}" -lt 12 ] && fail "数据库口令短于 12 位"
        case "$${NEXTAUTH_URL:-}" in
          https://*) ;;
          *) fail "NEXTAUTH_URL 必须是 https:// 开头的正式域名（当前：$${NEXTAUTH_URL:-空}）" ;;
        esac
        case "$${NEXTAUTH_URL}" in
          *localhost*|*127.0.0.1*) fail "NEXTAUTH_URL 还指向开发环境" ;;
        esac
        [ "$${#NEXTAUTH_SECRET}" -lt 32 ] && fail "NEXTAUTH_SECRET 短于 32 位"
        [ -z "$${ALLOWED_GITHUB_IDS:-}" ] && fail "ALLOWED_GITHUB_IDS 为空，登录后也进不去"
        [ -z "$${OSS_REGION:-}" ] && fail "OSS_REGION 为空，正文插图无法上传"
        [ -z "$${OSS_BUCKET:-}" ] && fail "OSS_BUCKET 为空，正文插图无法上传"
        [ -z "$${OSS_ACCESS_KEY_ID:-}" ] && fail "OSS_ACCESS_KEY_ID 为空，正文插图无法上传"
        [ -z "$${OSS_ACCESS_KEY_SECRET:-}" ] && fail "OSS_ACCESS_KEY_SECRET 为空，正文插图无法上传"
        echo "上线门禁通过：数据库用户 $${POSTGRES_USER}、口令长度 $${#POSTGRES_PASSWORD}、$${NEXTAUTH_URL}、OSS $${OSS_REGION}/$${OSS_BUCKET}（前缀 logs/）"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?必须在 .env.production 里指定非 root 用户}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?必须在 .env.production 里指定强口令}
      NEXTAUTH_URL: ${NEXTAUTH_URL:?必须填正式域名，例如 https://laity.example}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?生产密钥，不得与开发环境复用}
      ALLOWED_GITHUB_IDS: ${ALLOWED_GITHUB_IDS:?允许登录的 GitHub 账号 ID}
      # OSS 四项与 app 服务同源；写在这里是为了让 preflight 的门禁清单自身是完整的一份
      OSS_REGION: ${OSS_REGION:?OSS Bucket 所在地域，例如 oss-cn-beijing}
      OSS_BUCKET: ${OSS_BUCKET:?OSS Bucket 名称}
      OSS_ACCESS_KEY_ID: ${OSS_ACCESS_KEY_ID:?生产专用 RAM 子账号 AccessKey ID}
      OSS_ACCESS_KEY_SECRET: ${OSS_ACCESS_KEY_SECRET:?生产专用 RAM 子账号 AccessKey Secret}
    restart: "no"
    networks: [laity_back]

  db:
    image: postgres:16
    container_name: laity-db-prod
    restart: unless-stopped
    # 口令与库名都来自 .env.production，禁止写死；POSTGRES_USER 非 root（由 preflight 硬卡）
    depends_on:
      preflight:
        condition: service_completed_successfully
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?必须在 .env.production 里指定非 root 用户}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?必须在 .env.production 里指定强口令}
      POSTGRES_DB: ${POSTGRES_DB:-laity}
    volumes:
      - laity_prod_data:/var/lib/postgresql/data
    # 生产库不向宿主机发布端口，只有 app 走内部网络访问
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB:-laity}"]
      interval: 10s
      timeout: 5s
      retries: 6
    networks: [laity_back]

  app:
    build:
      context: .
      target: runner
    image: laity-archive:prod
    container_name: laity-app-prod
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-laity}?schema=public
      NEXTAUTH_URL: ${NEXTAUTH_URL:?必须填正式域名，例如 https://laity.example}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?生产密钥，不得与开发环境复用}
      GITHUB_ID: ${GITHUB_ID:?生产 OAuth App 的 Client ID}
      GITHUB_SECRET: ${GITHUB_SECRET:?生产 OAuth App 的 Secret}
      ALLOWED_GITHUB_IDS: ${ALLOWED_GITHUB_IDS:?允许登录的 GitHub 账号 ID}
      # I024：Phase 5b 的 OSS 传图。这四个键缺失时 src/lib/oss.ts 的 requireEnv 会在上传那一刻才抛错，
      # 用 ${VAR:?} 提前到部署阶段失败；值一律来自 .env.production，不落仓库
      OSS_REGION: ${OSS_REGION:?OSS Bucket 所在地域，例如 oss-cn-beijing}
      OSS_BUCKET: ${OSS_BUCKET:?OSS Bucket 名称}
      OSS_ACCESS_KEY_ID: ${OSS_ACCESS_KEY_ID:?生产专用 RAM 子账号 AccessKey ID}
      OSS_ACCESS_KEY_SECRET: ${OSS_ACCESS_KEY_SECRET:?生产专用 RAM 子账号 AccessKey Secret}
      # 合规位三项必须在这里显式传：compose 的 --env-file 只参与变量插值，不会自动注入容器，
      # 少了这三行，.env.production 里填了备案号页脚也永远不显示。用 :- 而不是 :? ——
      # 未备案 / 还没有公开邮箱时留空是合法状态，硬卡会把整个 up 拦死
      SITE_ICP: ${SITE_ICP:-}
      SITE_POLICE_ICP: ${SITE_POLICE_ICP:-}
      SITE_CONTACT_EMAIL: ${SITE_CONTACT_EMAIL:-}
    # 只绑 127.0.0.1：外部流量一律经 nginx，不给应用直接开口
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      # I036：探针改打 /api/health 并要求响应体里 db 为 true——这样"healthy"同时代表
      # 进程在、路由通、且应用真能连上库，而不是原来 /login 那种"进程活着"的弱信号。
      # 代价是库抖动会把 app 标成 unhealthy；compose 不因 unhealthy 自动重启（restart 只看退出），
      # 且 depends_on 只在启动时把关、运行期不追溯，所以不会形成级联停摆，只是把状态如实显示出来
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>r.json()).then(j=>process.exit(j.db===true?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      # 冷启动要多等一次库连接池建立，比原来打静态登录页的 20s 放宽到 30s
      start_period: 30s
    networks: [laity_back]

  migrate:
    build:
      context: .
      target: migrator
    # 钉死镜像名：不写 image 时 compose 会构建到项目默认名 laity-archive-migrate:latest，
    # 而部署步骤核对的是 laity-archive-migrate:prod——I026 的"连跑两次 ID 不变"就是量错了标签。
    # 钉死之后 `docker compose build migrate` 写的正是文档要核对的那个标签，判据才有意义
    image: laity-archive-migrate:prod
    profiles: ["tools"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-laity}?schema=public
    networks: [laity_back]

  web:
    image: nginx:1.27-alpine
    container_name: laity-nginx-prod
    restart: unless-stopped
    depends_on:
      # 等 app 真正常服务（库可连）再起 nginx，避免冷启动窗口里整站被 502；
      # nginx 自身不加探针：80 端口按 nginx.conf 直接 301 到 https，busybox wget 对重定向的
      # 判定不稳，且证书是外部投放的，本机无从端到端验，宁可不加也不写一个会误报健康的探针
      app:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/certs:/etc/nginx/certs:ro
    networks: [laity_back]

volumes:
  laity_prod_data:

networks:
  laity_back:
    driver: bridge
